name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, desktop-sso ]

# Restrict GITHUB_TOKEN permissions to read-only by default
permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      # A ctest failure on one leg must not cancel the other: a cancelled step
      # never runs `if: failure()`, so the sibling's LastTest.log would be
      # dropped — and for a timing-sensitive flake (#244) a second sample from
      # a different runner is the most useful evidence there is.
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libcurl4-openssl-dev \
          libjson-c-dev \
          libpam0g-dev \
          libsodium-dev \
          curl \
          jq \
          socat

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_LIBSODIUM=ON -DINSTALL_DESKTOP=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    # ctest writes the failing test's own stdout to LastTest.log. Keep it:
    # re-running a failed job replaces the workflow log, and with it the only
    # record of which sub-test failed and on which assertion (#244).
    - name: Upload ctest logs on failure
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: ctest-logs-${{ matrix.os }}-${{ github.run_attempt }}
        path: build/Testing/Temporary/
        retention-days: 7
        if-no-files-found: warn

    - name: Check PAM module symbols
      run: |
        echo "Checking exported PAM symbols..."
        nm -D build/pam_openbastion.so.* | grep -E "pam_sm_(authenticate|setcred|acct_mgmt)" || exit 1
        echo "All required PAM symbols found"

    - name: Verify all script syntax
      run: |
        for script in scripts/ob-*; do
          echo "Checking syntax: $script"
          bash -n "$script"
        done

    - name: Run script unit tests
      run: |
        for test in tests/test_ob_*.sh; do
          echo "Running: $test"
          bash "$test"
        done

    # This suite reads the tree and nothing else -- no docker, no portal, no
    # build -- so it has no legitimate reason to skip, and its whole subject is
    # a helper that went missing from the packaging (#263). It refuses to skip
    # on its own now; this is the belt to that braces.
    - name: The service-account suite must actually run
      run: |
        out=$(bash tests/test_ob_service_account_keys.sh 2>&1); echo "$out"
        case "$out" in
          *SKIP*)
            echo "::error::tests/test_ob_service_account_keys.sh skipped; it must run in CI"
            exit 1 ;;
        esac

    # Same reasoning as the fingerprint sink below: this suite is the only thing
    # proving the OIDC client secret stays out of /proc/<pid>/cmdline (#256),
    # and it skips when ob-client-jwt is not built. A packaging change that
    # stopped building the helper would leave CI green while ob-enroll refused
    # to enrol at all.
    - name: The client-assertion suite must actually run
      run: |
        out=$(bash tests/test_ob_client_jwt.sh 2>&1); echo "$out"
        case "$out" in
          *SKIP*)
            echo "::error::tests/test_ob_client_jwt.sh skipped; it must run in CI"
            exit 1 ;;
        esac

    # The loop above treats a SKIP as success, which is right for suites that
    # need docker or a portal. It is wrong for the fingerprint sink: that suite
    # is the only thing guarding the trust root moved in #249, and if it skipped
    # -- no socat, no build -- CI would stay green while testing nothing.
    - name: The fingerprint sink suite must actually run
      run: |
        out=$(bash tests/test_ob_fp_daemon.sh 2>&1); echo "$out"
        case "$out" in
          *SKIP*)
            echo "::error::tests/test_ob_fp_daemon.sh skipped; it must run in CI"
            exit 1 ;;
        esac

  build-debug:
    name: Build Debug with Sanitizers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libcurl4-openssl-dev \
          libjson-c-dev \
          libpam0g-dev \
          libsodium-dev

    - name: Configure CMake with Debug and Sanitizers
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DUSE_LIBSODIUM=ON \
          -DINSTALL_DESKTOP=ON \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

    - name: Build
      run: cmake --build build --parallel

    - name: Run tests with sanitizers
      env:
        ASAN_OPTIONS: detect_leaks=1
      run: |
        cd build
        ctest --output-on-failure

    - name: Upload ctest logs on failure
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: ctest-logs-sanitizers-${{ github.run_attempt }}
        path: build/Testing/Temporary/
        retention-days: 7
        if-no-files-found: warn

  package-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # tests/test_ob_upgrade.sh stages a host from the v0.6.2 tag; the
        # default shallow checkout has no tags and the suite would SKIP --
        # which reads as a pass, which is the whole thing the guard below
        # exists to prevent.
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libcurl4-openssl-dev \
          libjson-c-dev \
          libpam0g-dev \
          libsodium-dev

    - name: Configure and build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DUSE_LIBSODIUM=ON
        cmake --build build --parallel

    # cpack reports a failed install step as "CMake Error" and still exits 0
    # with a package missing the files that step should have put there.
    - name: Create Debian package
      run: |
        cd build
        cpack -G DEB 2>&1 | tee cpack.log
        if grep -q 'CMake Error' cpack.log; then
          echo "::error::cpack reported install errors; the package is incomplete"
          exit 1
        fi

    # Upgrades a host staged from the v0.6.2 tag and checks it converges.
    # It needs docker and a package, which only this job has; on the build jobs
    # it SKIPs, and a skip reads as a pass -- so here it must actually run.
    - name: The upgrade suite must actually run
      run: |
        # cpack emits two packages here; the builder one carries no
        # ob-post-upgrade, so name the main one rather than take the newest.
        deb=$(ls -t build/open-bastion-*-Linux.deb | head -1)
        out=$(OB_DEB="$deb" bash tests/test_ob_upgrade.sh 2>&1); echo "$out"
        case "$out" in
          *SKIP*)
            echo "::error::tests/test_ob_upgrade.sh skipped; it must run here"
            exit 1 ;;
        esac

    - name: Upload Debian package
      uses: actions/upload-artifact@v7
      with:
        name: debian-package
        path: build/*.deb
        retention-days: 7

  build-rpm:
    name: Build RPM (Rocky Linux ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    container: rockylinux:${{ matrix.version }}

    strategy:
      # Same reason as the build matrix: keep every leg's ctest log (#244).
      fail-fast: false
      matrix:
        version: [9]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        dnf install -y epel-release dnf-plugins-core
        dnf config-manager --set-enabled crb
        dnf install -y \
          cmake \
          gcc \
          make \
          pam-devel \
          libcurl-devel \
          json-c-devel \
          openssl-devel \
          libsodium-devel \
          rpm-build \
          systemd-rpm-macros

    - name: Build RPM
      run: |
        VERSION=$(grep -oP 'project\(open-bastion VERSION \K[0-9.]+' CMakeLists.txt)
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        tar czf ~/rpmbuild/SOURCES/open-bastion-${VERSION}.tar.gz \
          --transform "s,^,open-bastion-${VERSION}/," \
          --exclude='.git' .
        rpmbuild -ba rpm/open-bastion.spec

    # The %check section runs ctest inside the rpmbuild tree, so its
    # LastTest.log lives there and is lost with the job log on a re-run (#244).
    - name: Upload ctest logs on failure
      if: failure() || cancelled()
      uses: actions/upload-artifact@v7
      with:
        name: ctest-logs-rocky${{ matrix.version }}-${{ github.run_attempt }}
        path: ~/rpmbuild/BUILD/open-bastion-*/redhat-linux-build/Testing/Temporary/
        retention-days: 7
        if-no-files-found: warn

    - name: Upload RPM package
      uses: actions/upload-artifact@v7
      with:
        name: rpm-package-el${{ matrix.version }}
        path: ~/rpmbuild/RPMS/*/*.rpm
        retention-days: 7

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: './scripts'
        severity: warning

  mutation:
    name: Mutation (every control must be able to fail)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    # A container so the run is root: some controls can only be isolated with
    # privilege, and OB_MUTATION_STRICT below turns "not exercised here" into an
    # error rather than letting it read as a pass.
    container: debian:trixie

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          build-essential cmake pkg-config git jq curl python3 openssh-client \
          socat util-linux \
          libcurl4-openssl-dev libjson-c-dev libpam0g-dev libssl-dev libkeyutils-dev

    # The suites the catalogue drives must be able to RUN here: one that skips
    # for a missing dependency is green before and after the mutation, and the
    # runner now refuses to conclude from that rather than calling it a
    # surviving mutant. socat is what tests/test_ob_fp_daemon.sh needs.
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build -j"$(nproc)"

    # Removes each control in tests/mutation/catalogue and requires the suite
    # that guards it to fail. A surviving mutant means a green suite that checks
    # nothing -- which is what several reviews found by hand during 0.7.0, one
    # PR at a time.
    # The repository must be readable by the unprivileged user the runner drops
    # to for `needs: nonroot` entries (setpriv, from util-linux above).
    - name: Mutation
      run: |
        chmod -R a+rX .
        OB_MUTATION_STRICT=1 bash tests/test_ob_mutation.sh
      timeout-minutes: 20

  integration-test:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install llng CLI
      run: |
        # Install simple-oidc-client (llng CLI)
        git clone --depth 1 https://github.com/linagora/simple-oidc-client.git /tmp/simple-oidc-client
        sudo cp /tmp/simple-oidc-client/sh/llng /usr/local/bin/
        sudo cp /tmp/simple-oidc-client/sh/llng-lib.sh /usr/local/bin/
        sudo chmod +x /usr/local/bin/llng

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl openssh-client ansible-core

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Run integration tests
      run: |
        chmod +x tests/test_integration_docker.sh
        ./tests/test_integration_docker.sh --verbose
      timeout-minutes: 15

    # These two need docker and are not matched by the tests/test_ob_*.sh loop
    # in the build job, so nothing ran them at all until now -- and one of them
    # had been silently broken. tests/test_ob_ci_coverage.sh fails if another
    # test file ends up in the same position.
    - name: Backend certificate acceptance
      run: bash tests/test_backend_cert_acceptance.sh
      timeout-minutes: 15

    - name: Service-account token integration
      run: bash tests/test_integration_token_svc.sh
      timeout-minutes: 15

    - name: Show container logs on failure
      if: failure()
      run: |
        cd docker-demo-cert
        docker compose logs || true

  integration-test-maxsec:
    name: Integration Tests - Mode E (Docker)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install llng CLI
      run: |
        git clone --depth 1 https://github.com/linagora/simple-oidc-client.git /tmp/simple-oidc-client
        sudo cp /tmp/simple-oidc-client/sh/llng /usr/local/bin/
        sudo cp /tmp/simple-oidc-client/sh/llng-lib.sh /usr/local/bin/
        sudo chmod +x /usr/local/bin/llng

    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl openssh-client

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Run Mode E integration tests
      run: |
        chmod +x tests/test_integration_maxsec.sh
        ./tests/test_integration_maxsec.sh --verbose
      timeout-minutes: 15

    - name: Show container logs on failure
      if: failure()
      run: |
        cd docker-demo-maxsec
        docker compose logs || true
